version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: villa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: villa_db
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-TEST-placeholder}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-placeholder-secret}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
