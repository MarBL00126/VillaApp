spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: appVillaSanMartin
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:villa_db}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
  flyway:
    enabled: false
    locations: classpath:db/migration
  mvc:
    contentnegotiation:
      media-types:
        css: text/css
        js: application/javascript
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: INFO
    root: INFO

jwt:
  secret: ${JWT_SECRET}
  # Access token corto (15 min); la sesion se renueva con /api/auth/refresh.
  expiration: 900000
  refresh-expiration: 604800000
mercadopago:
  access-token: ${MP_ACCESS_TOKEN:TEST-placeholder}
  webhook-secret: ${MP_WEBHOOK_SECRET:placeholder-secret}

app:
  # CRÍTICO-4 FIX: Setear APP_BASE_URL en producción con el dominio real.
  # Ejemplo Railway: APP_BASE_URL=https://villaapp-production.up.railway.app
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: ${APP_UPLOAD_DIR:${java.io.tmpdir}/villa-uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Admin}
    surname: ${ADMIN_SURNAME:Villa}
    phone: ${ADMIN_PHONE:0000000000}
storage:
  endpoint: ${STORAGE_ENDPOINT:}
  public-url: ${STORAGE_PUBLIC_URL:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  region: ${STORAGE_REGION:auto}
  bucket: ${STORAGE_BUCKET:}
  path-style: ${STORAGE_PATH_STYLE:true}
